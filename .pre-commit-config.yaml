repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'bad=$(gofmt -l pkg/ nautical.go); if [ -n "$bad" ]; then echo "gofmt needed on:"; echo "$bad"; exit 1; fi'
        language: system
        pass_filenames: false
        types_or: [go]
